<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14283e"><title>CATM Scoring</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#edf2f7;color:#182b40}*{box-sizing:border-box}body{margin:0}header{background:#14283e;color:#fff;padding:19px 16px}header h1{font-size:22px;margin:0 0 4px}main{max-width:850px;margin:auto;padding:12px}.panel{background:white;border-radius:14px;padding:15px;margin:0 0 12px;box-shadow:0 1px 4px #172b4010}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{font-size:13px;color:#62748a;line-height:1.5}.small{font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select{width:100%;min-width:0;border:1px solid #bfcbd8;border-radius:8px;padding:10px;font:inherit;background:#fff;color:#182b40}input[type=number]{font-variant-numeric:tabular-nums}button{border:0;border-radius:9px;background:#dce6ef;color:#14283e;font:inherit;font-weight:650;padding:11px 13px;cursor:pointer}button.primary{background:#215d8e;color:white}button.active{background:#14283e;color:#fff}button.danger{background:#b63137;color:white}button:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px 6px;font-size:13px}.entry{border:1px solid #dce3ec;border-radius:10px;padding:11px;margin-top:8px}.tag{display:inline-block;background:#e8eff6;border-radius:20px;padding:5px 9px;font-size:12px}.weapons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.weapons button{padding:18px 5px}.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.courses button{min-height:52px}.selected{outline:3px solid #215d8e;outline-offset:-3px}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}.scoretable{border-collapse:separate;border-spacing:5px;min-width:630px;width:100%;table-layout:fixed}.scoretable th{font-size:13px;background:#e8eff6;border-radius:8px;padding:10px 5px}.scoretable th:first-child{width:83px}.scoretable td{vertical-align:top;border:1px solid #dce3ec;border-radius:9px;padding:8px}.scoretable td:first-child{font-weight:700;vertical-align:middle;border:0}.scoretable .cellfield{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:4px 0}.scoretable .cellfield span{font-size:12px;color:#53667c}.scoretable input{width:66px;padding:7px;text-align:center}.scoretable .overall{display:flex;justify-content:space-between;border-top:1px solid #dce3ec;padding-top:7px;margin-top:8px;font-size:13px}.footer{text-align:center;color:#68788c;font-size:12px;padding:12px 0 22px}.notice{background:#fff4dc;border-radius:9px;padding:10px;font-size:13px;color:#76501b}.dangerarea{border:1px solid #e4bdbe}.hint{margin:8px 0}.spacer{height:8px}@media(max-width:400px){.weapons{grid-template-columns:repeat(2,1fr)}.panel{padding:12px}.tabs button{font-size:12px}}
.areaedit{border:1px solid #e0e8f0;border-radius:9px;padding:10px;margin:10px 0;background:#f8fafc}.dynamic{min-width:max(630px,100%);table-layout:auto}.dynamic th{min-width:100px}.dynamic th:first-child{min-width:76px}.dynamic td input{width:78px}.dynamic th small{display:block;font-weight:400;color:#62748a;margin-top:3px}.calculated{display:block;text-align:center;padding:10px 0}.dynamic select{min-width:160px}</style></head><body><header><h1>CATM Qualification Scoring</h1><div class="small">Testing version 5 • locally saved on this device</div></header><main><div id="nav" class="tabs"></div><div id="app"></div><div class="footer">Prototype only. Phase thresholds are test-only; official course qualification is not calculated. Use fictional personnel for testing.</div></main><script>
'use strict';
const KEY='catm-scoring-v3', PREV='catm-scoring-v2'; // V4 uses existing V3 storage
const CATALOG={'M18':['AFQC','DQC','BAT','Sustainment'],'Glock 19':['BAT'],'Glock 26':['BAT'],'M4A1':['Zero Fire','AFQC','DQC','Sustainment'],'M4':['Zero Fire','AFQC','DQC','Sustainment'],'M110A1':['Annual','Recurring','Sustainment']};
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WEAPONS=['M18','Glock 19','Glock 26','M4A1','M4','M110A1'];
const STARTERS=[['AFQC',['M18','M4A1','M4']],['DQC',['M18','M4A1','M4']],['BAT',['M18','Glock 19','Glock 26']],['Zero Fire',['M4A1','M4']],['Annual',['M110A1']],['Recurring',['M110A1']],['Sustainment',['M18','M4A1','M4','M110A1']]];
const starterCourses=()=>STARTERS.map(([name,weapons],i)=>({id:'c'+i,name,weapons,phases:[{id:'p1',name:'Table 1',rounds:'',areas:[{id:'a1',name:'Phase 1',mode:'manual',sources:[],qual:'',expert:''}],time:{enabled:false,seconds:''}}],defaultRounds:0,notes:'Unverified placeholder. Set actual course requirements before operational use.',version:1}));
const fresh=()=>({weapon:'',course:'',view:'home',sessions:{},courses:starterCourses(),editing:''});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(PREV))||fresh()}catch{db=fresh()};if(!db.sessions)db=fresh();if(!Array.isArray(db.courses))db.courses=starterCourses();if(!db.editing)db.editing='';if(!localStorage.getItem(KEY)){const migrated={};for(const [k,s] of Object.entries(db.sessions)){const [w,name]=k.split('|');const c=db.courses.find(c=>c.name===name&&c.weapons.includes(w));if(c){s.template=JSON.parse(JSON.stringify(c));migrated[w+'|'+c.id]=s}else migrated[k]=s}db.sessions=migrated;db.course='';db.view='home'}
const courseById=id=>db.courses.find(c=>c.id===id);
const selectedCourse=()=>courseById(db.course);
const availableCourses=w=>db.courses.filter(c=>c.weapons.includes(w));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const attr=safe;
const phases=()=>selectedCourse()?.phases||[];
const keyFor=(w,c)=>w+'|'+c;
const courseKey=c=>c.id;
const sessionKey=()=>keyFor(db.weapon,db.course);
const currentTemplate=()=>selectedCourse();
const sid=(w,c)=>keyFor(w,c), current=()=>db.sessions[sessionKey()], shooter=()=>current()?.shooters.find(x=>x.id===current().selected)||current()?.shooters[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Check Safari storage settings.')}};
const n=x=>x===''?'':Math.max(0,Math.floor(Number(x)||0));
const blank=()=>({head:'',body:'',exterior:''});
const newArea=(name='New area',mode='manual',sources=[])=>({id:'a'+uid(),name,mode,sources,qual:'',expert:''});
function normalizeTable(t){if(!Array.isArray(t.areas)||!t.areas.length){t.areas=[newArea('Phase 1')]}if(!t.time)t.time={enabled:false,seconds:''};return t}
function normalizeCourse(c){if(!Array.isArray(c.phases)||!c.phases.length)c.phases=[{id:'p'+uid(),name:'Table 1',rounds:''}];c.phases.forEach(normalizeTable);if(!c.requirements)c.requirements={qual:'',expert:''};return c}
db.courses.forEach(c=>{if((c.version||1)!==1||c.phases?.length!==3)return;const untouched=c.phases.every((t,i)=>t.name==='Phase '+(i+1)&&(!t.rounds||t.rounds==='')&&(!t.time||!t.time.enabled)&&(!t.areas||t.areas.length===4&&t.areas.map(a=>a.name).join('|')==='Head|Body|Exterior|Overall'&&t.areas.every(a=>a.qual===''&&a.expert==='')));if(untouched)c.phases=[{id:'p'+uid(),name:'Table 1',rounds:'',areas:[newArea('Phase 1')],time:{enabled:false,seconds:''}}]});
db.courses.forEach(normalizeCourse);Object.values(db.sessions).forEach(s=>{if(s.template)normalizeCourse(s.template)});
const tableList=()=>current()?.template?.phases||[];
const areaValue=(record,table,area,seen=new Set())=>{if(!area||seen.has(area.id))return '';const raw=record?.[area.id];if(area.mode!=='sum')return raw==null?'':raw;const next=new Set(seen);next.add(area.id);const values=(area.sources||[]).map(id=>areaValue(record,table,table.areas.find(a=>a.id===id),next));return values.length&&values.every(v=>v!==''&&Number.isFinite(Number(v)))?values.reduce((sum,v)=>sum+Number(v),0):''};
const attemptRecord=(p,attempt,table)=>{const dest=attempt==='initial'?p.initialScores:p.refireScores;return dest[table.id]||{}};
function evaluateTable(p,attempt,table){const rec=attemptRecord(p,attempt,table);let complete=true,failed=false,hasRule=false;for(const a of table.areas){const val=areaValue(rec,table,a);if(a.mode==='sum'&&!a.sources.length)continue;if(val==='')complete=false;if(a.qual!==''&&a.qual!=null){hasRule=true;if(val!==''&&Number(val)<Number(a.qual))failed=true}}if(table.time?.enabled){hasRule=true;const t=(attempt==='initial'?p.initialTimes:p.refireTimes)?.[table.id]||'';if(!t)complete=false;else if(t==='over')failed=true}return !complete?'Incomplete':!hasRule?'Recorded':failed?'Fail':'Pass'}
function evaluateExpert(p,attempt,table){const rec=attemptRecord(p,attempt,table);let rules=0;for(const a of table.areas){if(a.expert!==''&&a.expert!=null){rules++;const v=areaValue(rec,table,a);if(v===''||Number(v)<Number(a.expert))return false}}return rules>0}
function setAreaScore(id,attempt,tableId,areaId,value){const p=current().shooters.find(x=>x.id===id);if(!p)return;const dest=attempt==='initial'?p.initialScores:p.refireScores;if(!dest[tableId])dest[tableId]={};dest[tableId][areaId]=value===''?'':n(value);save();refreshLive()}
function setTimeResult(id,attempt,tableId,value){const p=current().shooters.find(x=>x.id===id);if(!p)return;const key=attempt==='initial'?'initialTimes':'refireTimes';if(!p[key])p[key]={};p[key][tableId]=value;save();refreshLive()}

const makeShooter=(name,lane,rounds)=>({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,lane,initial:rounds,extra:0,initialScores:{},refireScores:{},initialTimes:{},refireTimes:{},refire:false});
const makeSession=()=>({date:new Date().toLocaleDateString('en-CA'),defaultRounds:0,selected:'',shooters:[],view:'roster'});
const isCustom=c=>c==='Sustainment';
function phaseNames(){return current()?.template?.phases?.map(p=>p.id)||phases().map(p=>p.id)};
function phaseTitle(id){return (current()?.template?.phases||phases()).find(p=>p.id===id)?.name||id};
function openCourse(){if(!db.weapon||!selectedCourse())return;const key=sessionKey();if(!db.sessions[key]){db.sessions[key]=makeSession();db.sessions[key].template=JSON.parse(JSON.stringify(selectedCourse()));db.sessions[key].defaultRounds=selectedCourse().defaultRounds||0}db.view='roster';save();render()}
function home(){db.view='home';save();render()}
function tab(v){db.view=v;save();render()}
function chooseWeapon(w){db.weapon=w;db.course='';save();render()}
function chooseCourse(c){db.course=c;save();render()}
function addShooter(){const s=current(),name=document.getElementById('newName').value.trim(),lane=document.getElementById('newLane').value;if(!name)return alert('Enter a shooter name.');const p=makeShooter(name,lane===''?'':n(lane),n(s.defaultRounds));s.shooters.push(p);s.selected=p.id;save();render()}
function removeShooter(id){if(!confirm('Remove this shooter and their scores?'))return;const s=current();s.shooters=s.shooters.filter(p=>p.id!==id);if(s.selected===id)s.selected=s.shooters[0]?.id||'';save();render()}
function editShooter(id,k,v){const p=current().shooters.find(x=>x.id===id);if(!p)return;p[k]=['initial','extra','lane'].includes(k)?n(v):v;save();if(k==='lane'||k==='name')render();else refreshLive()}
function updateSession(k,v){current()[k]=k==='defaultRounds'?n(v):v;save()}
function applyRounds(){if(!confirm('Replace the initial ammunition count for all shooters in this course?'))return;const s=current();s.shooters.forEach(p=>p.initial=n(s.defaultRounds));save();render()}
function openShooter(id){current().selected=id;tab('score')}
function next(d){const s=current();if(!s.shooters.length)return;let i=s.shooters.findIndex(p=>p.id===s.selected);s.selected=s.shooters[(i+d+s.shooters.length)%s.shooters.length].id;save();render()}
function toggleRefire(checked){const p=shooter();if(!p)return;if(!checked&&Object.values(p.refireScores).some(o=>Object.values(o).some(v=>v!==''))&&!confirm('Hide the refire row? Existing refire scores will be preserved.')){render();return}p.refire=checked;save();render()}
function setScore(id,attempt,phase,field,v){const p=current().shooters.find(x=>x.id===id);if(!p)return;const dest=attempt==='initial'?p.initialScores:p.refireScores;if(!dest[phase])dest[phase]=blank();dest[phase][field]=n(v);save();refreshLive()}
function sumPhase(o){if(!o||['head','body','exterior'].some(k=>o[k]===''||o[k]==null))return '—';return ['head','body','exterior'].reduce((a,k)=>a+Number(o[k]),0)}
function progress(p){return tableList().filter(t=>t.areas.every(a=>a.mode==='sum'?areaValue(p.initialScores[t.id]||{},t,a)!=='':(p.initialScores[t.id]?.[a.id]??'')!=='')&&(!t.time.enabled||!!p.initialTimes?.[t.id])).length}
function total(p){return (Number(p.initial)||0)+(Number(p.extra)||0)}
function clearAll(){const s=current();if(!s)return;const ok=confirm('CLEAR ALL for '+db.weapon+' '+db.course+'?\n\nThis permanently deletes all shooters, lanes, scores, refires and ammunition for this course. Other courses will not be affected.');if(!ok)return;const sure=prompt('Type CLEAR to confirm:');if(sure!=='CLEAR')return;db.sessions[sid(db.weapon,db.course)]=makeSession();db.sessions[sid(db.weapon,db.course)].template=JSON.parse(JSON.stringify(selectedCourse()));db.sessions[sid(db.weapon,db.course)].defaultRounds=selectedCourse()?.defaultRounds||0;db.view='roster';save();render()}
function dashboard(){return `<section class="panel"><h2>Choose weapon system</h2><div class="weapons">${WEAPONS.map(w=>`<button class="${db.weapon===w?'selected active':''}" onclick="chooseWeapon('${w}')">${safe(w)}</button>`).join('')}</div></section>${db.weapon?`<section class="panel"><h2>${safe(db.weapon)} saved courses</h2><div class="courses">${availableCourses(db.weapon).map(c=>`<button class="${db.course===c.id?'selected active':''}" onclick="chooseCourse('${c.id}')">${safe(c.name)}</button>`).join('')||'<p class="muted">No courses assigned to this weapon. Use Course Editor to assign one.</p>'}</div>${selectedCourse()?`<p class="muted">${safe(selectedCourse().notes)}</p><button class="primary" style="width:100%" onclick="openCourse()">${db.sessions[sessionKey()]?'Continue':'Start'} ${safe(selectedCourse().name)} →</button>`:''}</section>`:''}<section class="panel"><h3>Saved course sessions</h3>${Object.entries(db.sessions).length?Object.entries(db.sessions).map(([k,s])=>`<div class="entry row between"><span>${safe(k.split('|')[0])} • ${safe(s.template?.name||courseById(k.split('|')[1])?.name||'Legacy course')}<div class="muted">${s.shooters.length} shooter(s)</div></span><button onclick="resume('${safe(k)}')">Open</button></div>`).join(''):'<p class="muted">No course sessions yet.</p>'}</section><section class="panel"><button class="primary" onclick="tab('editor')">⚙ Course Editor</button><p class="muted">Create, edit, duplicate and assign reusable templates to weapons.</p></section>`}
function editor(){return `<section class="panel"><div class="row between"><h2>Course Library</h2><div class="row"><button onclick="home()">⌂ Home</button><button class="primary" onclick="newCourse()">+ New Course</button></div></div><p class="muted">These are editable starter templates, not verified official standards. Changes affect new classes only.</p>${db.courses.map(c=>`<div class="entry"><div class="row between"><div><strong>${safe(c.name)}</strong><div class="muted">${c.weapons.map(safe).join(', ')||'No weapons assigned'} • ${c.phases.length} tables • v${c.version||1}</div></div><div class="row"><button onclick="editCourse('${c.id}')">Edit</button><button onclick="duplicateCourse('${c.id}')">Copy</button><button onclick="deleteCourse('${c.id}')">×</button></div></div></div>`).join('')}</section><section class="panel"><h3>Course library backup</h3><div class="row"><button onclick="exportLibrary()">Export templates</button><label style="flex:1">Import templates<input type="file" accept="application/json,.json" onchange="importLibrary(this.files[0])"></label></div><p class="muted">Save a backup to Files. Templates are stored on this device, not in GitHub.</p></section>`}
function newCourse(){const c={id:'c'+uid(),name:'New Course',weapons:[],phases:[normalizeTable({id:'p'+uid(),name:'Table 1',rounds:'',areas:[newArea('Phase 1')]})],defaultRounds:0,notes:'Custom template',version:1};db.courses.push(c);db.editing=c.id;db.view='edit';save();render()}
function editCourse(id){db.editing=id;db.view='edit';save();render()}
function duplicateCourse(id){const c=courseById(id);if(!c)return;const d=JSON.parse(JSON.stringify(c));d.id='c'+uid();d.name=c.name+' Copy';d.version=1;db.courses.push(d);db.editing=d.id;db.view='edit';save();render()}
function deleteCourse(id){if(!confirm('Delete this course template from the library? Existing class scores will remain saved.'))return;db.courses=db.courses.filter(c=>c.id!==id);if(db.course===id)db.course='';db.view='editor';save();render()}
function updateTemplate(k,v){const c=courseById(db.editing);if(!c)return;c[k]=k==='defaultRounds'?n(v):v;c.version=(c.version||1)+1;save()}
function toggleWeapon(w,checked){const c=courseById(db.editing);if(!c)return;c.weapons=checked?[...new Set([...c.weapons,w])]:c.weapons.filter(x=>x!==w);c.version++;save()}
function updatePhase(id,k,v){const c=courseById(db.editing);const t=c?.phases.find(x=>x.id===id);if(!t)return;t[k]=k==='rounds'?(v===''?'':n(v)):v;c.version++;save()}
function addPhase(){const c=courseById(db.editing);if(!c)return;c.phases.push(normalizeTable({id:'p'+uid(),name:'Table '+(c.phases.length+1),rounds:'',areas:[newArea('Phase 1')]}));c.version++;save();render()}
function removePhase(id){const c=courseById(db.editing);if(!c||c.phases.length===1)return alert('A course must have at least one table.');if(!confirm('Remove this table from the template?'))return;c.phases=c.phases.filter(x=>x.id!==id);c.version++;save();render()}
function editArea(tableId,areaId,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a[k]=['qual','expert'].includes(k)?(v===''?'':n(v)):v;if(k==='mode'&&v==='sum'&&!a.sources)a.sources=[];c.version++;save();if(k==='mode')render()}
function addArea(tableId){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;t.areas.push(newArea('Phase '+(t.areas.length+1)));c.version++;save();render()}
function removeArea(tableId,areaId){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t||t.areas.length===1)return alert('Keep at least one scoring area.');if(!confirm('Remove this scoring phase?'))return;t.areas=t.areas.filter(x=>x.id!==areaId);t.areas.forEach(a=>a.sources=(a.sources||[]).filter(x=>x!==areaId));c.version++;save();render()}
function toggleSource(tableId,areaId,sourceId,checked){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a.sources=checked?[...new Set([...(a.sources||[]),sourceId])]:(a.sources||[]).filter(x=>x!==sourceId);c.version++;save()}
function setTableTime(tableId,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;t.time[k]=k==='seconds'?(v===''?'':n(v)):v;c.version++;save();if(k==='enabled')render()}
function editForm(){const c=courseById(db.editing);if(!c)return editor();return `<section class="panel"><div class="row between"><h2>Course Editor</h2><button onclick="tab('editor')">Done ✓</button></div><label>Course name<input value="${attr(c.name)}" onchange="updateTemplate('name',this.value)"></label><p class="muted">Assign this saved course to weapon systems.</p><div class="grid">${WEAPONS.map(w=>`<label class="row" style="display:flex"><input style="width:19px;height:19px" type="checkbox" ${c.weapons.includes(w)?'checked':''} onchange="toggleWeapon('${w}',this.checked)">${w}</label>`).join('')}</div><div class="spacer"></div><div class="grid"><label>Default ammunition<input type="number" min="0" value="${c.defaultRounds||0}" onchange="updateTemplate('defaultRounds',this.value)"></label><label>Notes<input value="${attr(c.notes)}" onchange="updateTemplate('notes',this.value)"></label></div></section><section class="panel"><h2>Firing tables</h2><p class="muted">Start with one Table and one Phase. Use Add table and Add scoring phase to create as many as you need. Blank Qual or Expert thresholds mean no minimum for that area. All examples are unverified.</p>${c.phases.map((t,i)=>`<div class="entry"><div class="row between"><h3>Table ${i+1}</h3><button onclick="removePhase('${t.id}')" ${c.phases.length===1?'disabled':''}>Remove table</button></div><div class="grid"><label>Table name<input value="${attr(t.name)}" onchange="updatePhase('${t.id}','name',this.value)"></label><label>Rounds in table<input type="number" min="0" placeholder="Not set" value="${attr(t.rounds)}" onchange="updatePhase('${t.id}','rounds',this.value)"></label></div><div class="row" style="margin:12px 0"><label class="row" style="display:flex"><input type="checkbox" style="width:20px" ${t.time.enabled?'checked':''} onchange="setTableTime('${t.id}','enabled',this.checked)"> Time limit applies</label>${t.time.enabled?`<label>Maximum seconds<input type="number" min="1" value="${attr(t.time.seconds)}" onchange="setTableTime('${t.id}','seconds',this.value)"></label>`:''}</div><h3>Scoring phases</h3>${t.areas.map((a,j)=>`<div class="areaedit"><div class="row between"><strong>Phase ${j+1}</strong><button onclick="removeArea('${t.id}','${a.id}')" ${t.areas.length===1?'disabled':''}>× Remove</button></div><div class="grid"><label>Scoring area<input value="${attr(a.name)}" onchange="editArea('${t.id}','${a.id}','name',this.value)"></label><label>Entry type<select onchange="editArea('${t.id}','${a.id}','mode',this.value)"><option value="manual" ${a.mode!=='sum'?'selected':''}>Enter hits</option><option value="sum" ${a.mode==='sum'?'selected':''}>Auto-sum other areas</option></select></label><label>Min. hits to Qual<input type="number" min="0" placeholder="Optional" value="${attr(a.qual)}" onchange="editArea('${t.id}','${a.id}','qual',this.value)"></label><label>Min. hits for Expert<input type="number" min="0" placeholder="Optional" value="${attr(a.expert)}" onchange="editArea('${t.id}','${a.id}','expert',this.value)"></label></div>${a.mode==='sum'?`<p class="muted">Include these scoring areas in the calculated total:</p><div class="grid">${t.areas.filter(x=>x.id!==a.id&&x.mode!=='sum').map(x=>`<label class="row" style="display:flex"><input type="checkbox" style="width:19px" ${(a.sources||[]).includes(x.id)?'checked':''} onchange="toggleSource('${t.id}','${a.id}','${x.id}',this.checked)">${safe(x.name)}</label>`).join('')}</div>`:''}</div>`).join('')}<p><button onclick="addArea('${t.id}')">+ Add scoring phase</button></p></div>`).join('')}<p><button class="primary" onclick="addPhase()">+ Add table</button></p></section><section class="panel"><button class="primary" style="width:100%" onclick="tab('editor')">Save and return to library</button><p class="muted">Changes save automatically and apply to newly started classes. Existing classes keep their saved template snapshot.</p></section>`}
function exportLibrary(){const blob=new Blob([JSON.stringify({type:'catm-course-library',version:1,courses:db.courses},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='catm-course-library.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importLibrary(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.type!=='catm-course-library'||!Array.isArray(obj.courses)||!obj.courses.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.weapons)&&Array.isArray(c.phases)&&c.phases.length))throw Error('Not a valid CATM course library');if(!confirm('Replace all saved course templates with this backup? Existing class scores will remain unchanged.'))return;db.courses=obj.courses.map(normalizeCourse);db.course='';save();render();alert('Templates imported successfully.')}catch(e){alert('Import failed: '+e.message)}}

function resume(key){const i=key.indexOf('|');db.weapon=key.slice(0,i);db.course=key.slice(i+1);openCourse()}
function roster(){const s=current();return `<section class="panel"><div class="row between"><h2>${safe(db.weapon)} • ${safe(current()?.template?.name||selectedCourse()?.name||db.course)}</h2><span class="tag">Scoring test V5</span></div><div class="grid"><label>Class date<input type="date" value="${safe(s.date)}" onchange="updateSession('date',this.value)"></label><label>Default initial rounds<input type="number" min="0" value="${s.defaultRounds}" onchange="updateSession('defaultRounds',this.value)"></label></div><p><button onclick="applyRounds()">Apply rounds to all</button></p><div class="notice">Phase names and ammunition defaults are placeholders. Phase pass/fail is a test calculation only; official course qualification is not calculated.</div></section><section class="panel"><h2>Class shooters (${s.shooters.length})</h2>${s.shooters.map(p=>`<div class="entry row between"><div><strong>${safe(p.name)}</strong><div class="muted">Lane ${safe(p.lane||'Unassigned')} • ${progress(p)}/${phaseNames().length} tables completed • ${total(p)} rounds</div></div><div class="row"><button class="primary" onclick="openShooter('${p.id}')">Score</button><button onclick="removeShooter('${p.id}')" aria-label="Remove shooter">×</button></div></div>`).join('')||'<p class="muted">No shooters yet. Add a fictional shooter below.</p>'}<h3 style="margin-top:17px">Add shooter</h3><div class="grid"><label>Name<input id="newName" placeholder="Fictional name"></label><label>Lane<input id="newLane" type="number" min="1" placeholder="Lane number"></label></div><p><button class="primary" onclick="addShooter()">Add shooter</button></p></section>`}
function phaseCell(p,attempt,phase){const obj=(attempt==='initial'?p.initialScores:p.refireScores)[phase]||blank();return `<td>${['head','body','exterior'].map(k=>`<label class="cellfield"><span>${k==='exterior'?'Exterior':k==='head'?'Head':'Body'}</span><input type="number" min="0" inputmode="numeric" placeholder="—" value="${safe(obj[k])}" oninput="setScore('${p.id}','${attempt}','${phase}','${k}',this.value)"></label>`).join('')}<div class="overall"><strong>Overall</strong><strong id="sum-${attempt}-${phase.replace(' ','')}">${sumPhase(obj)}</strong></div></td>`}
function score(){const s=current(),p=shooter();if(!p)return `<section class="panel"><h2>No shooters</h2><p>Add a shooter first.</p><button onclick="tab('roster')">Go to shooters</button></section>`;return `<section class="panel"><div class="row between"><h2>${safe(p.name)}</h2><span class="tag">${safe(db.weapon)} • ${safe(current()?.template?.name||selectedCourse()?.name||db.course)}</span></div><div class="grid"><label>Lane<input type="number" min="1" value="${safe(p.lane)}" onchange="editShooter('${p.id}','lane',this.value)"></label><label>Initial rounds<input type="number" min="0" value="${safe(p.initial)}" oninput="editShooter('${p.id}','initial',this.value)"></label><label>Additional rounds<input type="number" min="0" value="${safe(p.extra)}" oninput="editShooter('${p.id}','extra',this.value)"></label></div><p><strong id="roundTotal">Total ammunition: ${total(p)} rounds</strong></p></section>${tableList().map(t=>`<section class="panel"><h2>${safe(t.name)}</h2><p class="muted">${t.rounds===''?'Rounds not configured':safe(t.rounds)+' rounds'} ${t.time.enabled?'• Time limit '+safe(t.time.seconds||'not set')+' seconds':''}</p><div class="scroll"><table class="scoretable dynamic"><thead><tr><th>Attempt</th>${t.areas.map(a=>`<th>${safe(a.name)}${a.qual!==''?`<small>Qual ≥${safe(a.qual)}</small>`:''}${a.expert!==''?`<small>Expert ≥${safe(a.expert)}</small>`:''}</th>`).join('')}<th>Status</th></tr></thead><tbody>${['initial',...(p.refire?['refire']:[])].map(at=>`<tr><td>${at==='initial'?'Initial':'Refire'}</td>${t.areas.map(a=>`<td>${a.mode==='sum'?`<strong class="calculated" data-calc="${at}-${t.id}-${a.id}">${areaValue(attemptRecord(p,at,t),t,a)===''?'—':areaValue(attemptRecord(p,at,t),t,a)}</strong>`:`<input type="number" min="0" inputmode="numeric" placeholder="—" value="${safe(attemptRecord(p,at,t)[a.id]??'')}" oninput="setAreaScore('${p.id}','${at}','${t.id}','${a.id}',this.value)">`}</td>`).join('')}<td><strong data-status="${at}-${t.id}">${evaluateTable(p,at,t)}</strong></td></tr>${t.time.enabled?`<tr><td>Time</td><td colspan="${t.areas.length+1}"><select onchange="setTimeResult('${p.id}','${at}','${t.id}',this.value)"><option value="">Not recorded</option><option value="within" ${(at==='initial'?p.initialTimes:p.refireTimes)?.[t.id]==='within'?'selected':''}>Within time</option><option value="over" ${(at==='initial'?p.initialTimes:p.refireTimes)?.[t.id]==='over'?'selected':''}>Over time</option></select></td></tr>`:''}`).join('')}</tbody></table></div></section>`).join('')}<section class="panel"><label class="row" style="display:flex;gap:10px"><input type="checkbox" style="width:20px;height:20px" ${p.refire?'checked':''} onchange="toggleRefire(this.checked)"> Show refire entries</label><p class="muted">Initial and refire scores are preserved separately. This prototype does not enforce official refire eligibility or calculate final qualification/Expert status.</p><div id="scoreProgress" class="muted">${progress(p)}/${tableList().length} initial tables completed</div></section><section class="panel row between"><button onclick="next(-1)">← Previous</button><button class="primary" onclick="next(1)">Next shooter →</button></section>`}
function totals(){const s=current();return `<section class="panel"><h2>Course totals</h2><p style="font-size:30px;margin:0"><strong>${s.shooters.reduce((a,p)=>a+total(p),0)}</strong> <span class="muted">rounds</span></p><p class="muted">${s.shooters.length} shooters • ${safe(db.weapon)} ${safe(db.course)} • ${safe(s.date)}</p></section><section class="panel"><h2>Shooter progress</h2>${s.shooters.map(p=>`<div class="entry row between"><div><strong>${safe(p.name)}</strong><div class="muted">Lane ${safe(p.lane||'—')} • ${progress(p)}/${phaseNames().length} initial tables • Refire ${p.refire?'shown':'not used'}</div></div><strong>${total(p)} rds</strong></div>`).join('')||'<p class="muted">No shooters added.</p>'}</section><section class="panel dangerarea"><h2>Reset this class</h2><p class="muted">Deletes all shooters, lane assignments, scores, refires and ammunition for this weapon/course only. Other course sessions remain saved.</p><button class="danger" onclick="clearAll()">Clear All</button></section>`}
function refreshLive(){const p=shooter();if(!p)return;const t=document.getElementById('roundTotal');if(t)t.textContent='Total ammunition: '+total(p)+' rounds';const x=document.getElementById('scoreProgress');if(x)x.textContent=progress(p)+'/'+tableList().length+' initial tables completed';for(const table of tableList())for(const at of ['initial','refire']){const rec=attemptRecord(p,at,table);for(const a of table.areas){const e=document.querySelector(`[data-calc="${at}-${table.id}-${a.id}"]`);if(e){const v=areaValue(rec,table,a);e.textContent=v===''?'—':v}}const st=document.querySelector(`[data-status="${at}-${table.id}"]`);if(st)st.textContent=evaluateTable(p,at,table)}}
function render(){const isHome=db.view==='home'||((db.view!=='editor'&&db.view!=='edit')&&!current());document.getElementById('nav').innerHTML=(isHome||db.view==='editor'||db.view==='edit')?'':`<button onclick="home()">⌂ Home</button><button class="${db.view==='roster'?'active':''}" onclick="tab('roster')">Shooters</button><button class="${db.view==='score'?'active':''}" onclick="tab('score')">Score</button><button class="${db.view==='totals'?'active':''}" onclick="tab('totals')">Totals</button>`;document.getElementById('app').innerHTML=db.view==='editor'?editor():db.view==='edit'?editForm():isHome?dashboard():({roster,score,totals}[db.view]||roster)()}
render();
</script></body></html>
