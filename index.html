</style></head><body><header class="brand-header"><div class="brand-inner"><div class="brand-text"><h1>RANGE<span>TRACK</span></h1><div class="brand-sub">CATM QUALIFICATION SYSTEM</div></div></div></header><main><div id="nav" class="tabs"></div><div id="app"></div><div class="footer">RangeTrack • Data stored locally on this device. Verify course standards and refire policy before operational use.</div></main><script>
'use strict';
const KEY='catm-scoring-v3', PREV='catm-scoring-v2'; // V4 uses existing V3 storage
const CATALOG={'M18':['AFQC','DQC','BAT','Sustainment'],'Glock 19':['BAT'],'Glock 26':['BAT'],'M4A1':['Zero Fire','AFQC','DQC','Sustainment'],'M4':['Zero Fire','AFQC','DQC','Sustainment'],'M110A1':['Annual','Recurring','Sustainment']};
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEFAULT_WEAPONS=['M18','Glock 19','Glock 26','M4A1','M4','M110A1'];
const STARTERS=[['AFQC',['M18','M4A1','M4']],['DQC',['M18','M4A1','M4']],['BAT',['M18','Glock 19','Glock 26']],['Zero Fire',['M4A1','M4']],['Annual',['M110A1']],['Recurring',['M110A1']],['Sustainment',['M18','M4A1','M4','M110A1']]];
const starterCourses=()=>STARTERS.map(([name,weapons],i)=>({id:'c'+i,name,weapons,phases:[{id:'p1',name:'Table 1',rounds:'',areas:[{id:'a1',name:'Scoring Requirement 1',mode:'manual',sources:[],qual:'',expert:''}],time:{enabled:false,seconds:''}}],defaultRounds:0,notes:'Unverified placeholder. Set actual course requirements before operational use.',version:1}));
// Verified M18 DQC scoring configuration (DAFMAN 31-131V2, para 19.3.4).
// Three cumulative evaluation tables; every scoreable area remains fully editable.
const M18_DQC_ID='c-m18-dqc-preloaded';
function m18DqcCourse(){
 const area=(id,name,expert)=>({id,name,mode:'manual',sources:[],qual:'',expert,countScore:true});
 const table=(id,name,rounds,qualMin,expertTotal,vital,head)=>({
  id,name,rounds,qualMin,expertTotal,
  areas:[area(id+'-vital','Vital Area (10-inch)',vital),area(id+'-head','Head (6-inch)',head),area(id+'-outside','Outside Zones (Silhouette)','')],
  time:{enabled:false,seconds:''}
 });
 return {id:M18_DQC_ID,name:'M18 DQC (Preloaded)',weapons:['M18'],defaultRounds:100,version:1,
  notes:'DAFMAN 31-131V2 para 19.3.4. Score each table cumulatively after all orders of fire. Expert requires every table to meet its Expert thresholds. Verify refire rules before operational use.',
  phases:[table('m18dqc-t1','Phase I: Basic Marksmanship Evaluation',25,18,25,19,2),
          table('m18dqc-t2','Phase II: Advanced Marksmanship Evaluation',25,18,25,20,2),
          table('m18dqc-t3','Phase III: Limited Visibility Evaluation',50,35,50,43,1)]};
}
const fresh=()=>({weapon:'',course:'',view:'home',sessions:{},courses:starterCourses(),editing:''});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(PREV))||fresh()}catch{db=fresh()};if(!db.sessions)db=fresh();if(!Array.isArray(db.courses))db.courses=starterCourses();if(!db.editing)db.editing='';if(!Array.isArray(db.weapons))db.weapons=[...DEFAULT_WEAPONS];db.weapons=[...new Set(db.weapons.filter(w=>typeof w==='string'&&w.trim()).map(w=>w.trim()))];if(!localStorage.getItem(KEY)){const migrated={};for(const [k,s] of Object.entries(db.sessions)){const [w,name]=k.split('|');const c=db.courses.find(c=>c.name===name&&c.weapons.includes(w));if(c){s.template=JSON.parse(JSON.stringify(c));migrated[w+'|'+c.id]=s}else migrated[k]=s}db.sessions=migrated;db.course='';db.view='home'}
// Add the official M18-specific starter once, without overwriting any saved templates or sessions.
if(!db.courses.some(c=>c.id===M18_DQC_ID))db.courses.push(m18DqcCourse());
const WEAPONS=db.weapons;
const courseById=id=>db.courses.find(c=>c.id===id);
const selectedCourse=()=>courseById(db.course);
const availableCourses=w=>db.courses.filter(c=>c.weapons.includes(w));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const attr=safe;
const phases=()=>selectedCourse()?.phases||[];
const keyFor=(w,c)=>w+'|'+c;
const courseKey=c=>c.id;
const sessionKey=()=>keyFor(db.weapon,db.course);
const currentTemplate=()=>selectedCourse();
const sid=(w,c)=>keyFor(w,c), current=()=>db.sessions[sessionKey()], shooter=()=>current()?.shooters.find(x=>x.id===current().selected)||current()?.shooters[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Check Safari storage settings.')}};
const n=x=>x===''?'':Math.max(0,Math.floor(Number(x)||0));
const blank=()=>({head:'',body:'',exterior:''});
const newArea=(name='New area',mode='manual',sources=[])=>({id:'a'+uid(),name,mode,sources,qual:'',expert:'',countScore:true});
function normalizeTable(t){
 // V9 templates used nested firing phases. Preserve every area as an editable table area.
 if((t.scoringPhases||[]).length===1 && !t.v10Migrated){t.areas=t.scoringPhases[0].areas||t.areas;t.v10Migrated=true;}
 if(!Array.isArray(t.areas)||!t.areas.length){
  const groups=t.scoringPhases||[];
  if(groups.length===1)t.areas=groups[0].areas||[];
  else if(groups.length>1){
   t.areas=groups.flatMap(ph=>(ph.areas||[]).map(a=>({...a,id:'a'+uid(),name:ph.name+' / '+a.name})));
  }else t.areas=[newArea('Scoring Area 1')];
 }
 t.areas.forEach(a=>{if(a.countScore===undefined)a.countScore=a.mode!=='sum';if(!Array.isArray(a.sources))a.sources=[];});
 if(t.qualMin===undefined)t.qualMin='';
 if(t.expertTotal===undefined)t.expertTotal='';
 return t;
}
function normalizeCourse(c){if(!Array.isArray(c.phases)||!c.phases.length)c.phases=[{id:'p'+uid(),name:'Table 1',rounds:''}];c.phases.forEach(normalizeTable);if(!c.requirements)c.requirements={qual:'',expert:''};return c}
db.courses.forEach(c=>{if((c.version||1)!==1||c.phases?.length!==3)return;const untouched=c.phases.every((t,i)=>t.name==='Phase '+(i+1)&&(!t.rounds||t.rounds==='')&&(!t.time||!t.time.enabled)&&(!t.areas||t.areas.length===4&&t.areas.map(a=>a.name).join('|')==='Head|Body|Exterior|Overall'&&t.areas.every(a=>a.qual===''&&a.expert==='')));if(untouched)c.phases=[{id:'p'+uid(),name:'Table 1',rounds:'',areas:[newArea('Scoring Area 1')],time:{enabled:false,seconds:''}}]});
db.courses.forEach(normalizeCourse);Object.values(db.sessions).forEach(s=>{if(s.template){
 for(const t of s.template.phases||[]){const old=t.scoringPhases||[];
  if(old.length===1){for(const shooter of s.shooters||[]){for(const key of ['initialScores','refireScores']){const dest=shooter[key]||{};if(dest[old[0].id]&&!dest[t.id])dest[t.id]={...dest[old[0].id]};}}}
 }
 normalizeCourse(s.template);
}});
const tableList=()=>current()?.template?.phases||[];
const scoringPhases=t=>[t];
const phaseAsTable=(t,ph)=>t;
const areaValue=(record,table,area,seen=new Set())=>{if(!area||seen.has(area.id))return '';const raw=record?.[area.id];if(area.mode!=='sum')return raw==null?'':raw;const next=new Set(seen);next.add(area.id);const values=(area.sources||[]).map(id=>areaValue(record,table,table.areas.find(a=>a.id===id),next));return values.length&&values.every(v=>v!==''&&Number.isFinite(Number(v)))?values.reduce((sum,v)=>sum+Number(v),0):''};
const countSelected=(rec,table,key)=>{const areas=table.areas.filter(a=>a.mode!=='sum'&&a[key]);if(!areas.length)return '';const vals=areas.map(a=>areaValue(rec,table,a));return vals.every(v=>v!==''&&Number.isFinite(Number(v)))?vals.reduce((n,v)=>n+Number(v),0):''};
const countAllPaper=(rec,table)=>{const areas=table.areas.filter(a=>a.mode!=='sum');if(!areas.length)return '';const vals=areas.map(a=>areaValue(rec,table,a));return vals.every(v=>v!==''&&Number.isFinite(Number(v)))?vals.reduce((sum,v)=>sum+Number(v),0):''};
const scoreTotals=(rec,table)=>({qualifying:countSelected(rec,table,'countScore'),paper:countAllPaper(rec,table)});
const attemptRecord=(p,attempt,table)=>{const dest=attempt==='initial'?p.initialScores:p.refireScores;return dest[table.id]||{}};
function evaluateTable(p,attempt,table){
 const rec=attemptRecord(p,attempt,table);
 const manual=table.areas.filter(a=>a.mode!=='sum');
 if(!manual.length||manual.some(a=>(rec[a.id]??'')===''))return 'Incomplete';
 const totals=scoreTotals(rec,table);
 if(table.qualMin!==''&&table.qualMin!=null&&Number(totals.qualifying)<Number(table.qualMin))return 'Fail';
 for(const a of table.areas){if(a.qual!==''&&a.qual!=null&&Number(areaValue(rec,table,a))<Number(a.qual))return 'Fail'}
 return table.qualMin!==''||table.areas.some(a=>a.qual!=='')?'Pass':'Recorded';
}
function evaluateExpert(p,attempt,table){
 const rec=attemptRecord(p,attempt,table),totals=scoreTotals(rec,table);
 if(evaluateTable(p,attempt,table)==='Incomplete'||evaluateTable(p,attempt,table)==='Fail')return false;
 const has=table.expertTotal!==''||table.areas.some(a=>a.expert!=='');
 if(!has)return false;
 if(table.expertTotal!==''&&Number(totals.qualifying)<Number(table.expertTotal))return false;
 return table.areas.every(a=>a.expert===''||Number(areaValue(rec,table,a))>=Number(a.expert));
}
function tableStatus(p,attempt,t){
 const basic=evaluateTable(p,attempt,t);
 if(basic==='Incomplete')return 'Incomplete';
 if(basic==='Fail')return 'Fail';
 if(evaluateExpert(p,attempt,t))return 'Expert';
 return basic==='Pass'?'Qualified':'Recorded';
}
function refireEligible(p,t){return tableStatus(p,'initial',t)==='Fail'}
function effectiveTableStatus(p,t){
 const initial=tableStatus(p,'initial',t);
 if(!refireEligible(p,t))return initial;
 const retry=tableStatus(p,'refire',t);
 return retry==='Incomplete'?initial:retry;
}
function effectivePaperTotal(p){
 const vals=tableList().map(t=>scoreTotals(attemptRecord(p,refireEligible(p,t)&&tableStatus(p,'refire',t)!=='Incomplete'?'refire':'initial',t),t).paper);
 return vals.every(v=>v!=='')?vals.reduce((sum,v)=>sum+Number(v),0):'';
}
function overallStatus(p){
 const statuses=tableList().map(t=>effectiveTableStatus(p,t));
 if(!statuses.length||statuses.some(x=>x==='Incomplete'||x==='Recorded'))return 'Incomplete';
 if(statuses.some(x=>x==='Fail'))return 'Fail';
 return statuses.every(x=>x==='Expert')?'Expert':'Qualified';
}
function coursePaperTotal(p,attempt){
 const vals=tableList().map(t=>scoreTotals(attemptRecord(p,attempt,t),t).paper);
 return vals.every(x=>x!=='')?vals.reduce((sum,x)=>sum+Number(x),0):'';
}
function overallSummary(p){
 const initial=effectivePaperTotal(p);
 const status=overallStatus(p);
 return `<section class="panel" id="overallSummary"><h2>Overall Course Summary</h2><div class="row between"><strong>Total Hits on Paper (All Tables)</strong><strong style="font-size:24px" data-course-paper="initial">${initial===''?'—':initial}</strong></div><div class="row between" style="margin-top:12px"><strong>Overall Status</strong><strong style="font-size:24px" data-course-status>${status}</strong></div><p class="muted">Each failed Table uses its completed refire score in place of its initial score for final status and total hits. Incomplete refires retain the initial failed result.</p></section>`;
}
function setAreaScore(id,attempt,tableId,areaId,value){const p=current().shooters.find(x=>x.id===id);if(!p)return;const beforeEligible=refireEligible(p,tableList().find(t=>t.id===tableId));const dest=attempt==='initial'?p.initialScores:p.refireScores;if(!dest[tableId])dest[tableId]={};dest[tableId][areaId]=value===''?'':n(value);save();refreshLive();if(attempt==='initial'&&beforeEligible!==refireEligible(p,tableList().find(t=>t.id===tableId)))render()}
function setTimeResult(id,attempt,tableId,value){const p=current().shooters.find(x=>x.id===id);if(!p)return;const key=attempt==='initial'?'initialTimes':'refireTimes';if(!p[key])p[key]={};p[key][tableId]=value;save();refreshLive()}

const makeShooter=(name,lane,rounds,buttNumber="")=>({buttNumber,id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,lane,initial:rounds,extra:0,initialScores:{},refireScores:{},initialTimes:{},refireTimes:{},refire:false});
const makeSession=()=>({date:new Date().toLocaleDateString('en-CA'),defaultRounds:0,selected:'',shooters:[],view:'roster'});
const isCustom=c=>c==='Sustainment';
function phaseNames(){return current()?.template?.phases?.map(p=>p.id)||phases().map(p=>p.id)};
function phaseTitle(id){return (current()?.template?.phases||phases()).find(p=>p.id===id)?.name||id};
function openCourse(){if(!db.weapon||!selectedCourse())return;const key=sessionKey();if(!db.sessions[key]){db.sessions[key]=makeSession();db.sessions[key].template=JSON.parse(JSON.stringify(selectedCourse()));db.sessions[key].defaultRounds=selectedCourse().defaultRounds||0}db.view='roster';save();render()}
function home(){db.view='home';dashboardSection='';save();render()}
function tab(v){db.view=v;save();render()}
function chooseWeapon(w){dashboardSection='course';db.weapon=w;db.course='';save();render()}
function chooseCourse(c){db.course=c;save();render()}
function addShooter(){const s=current(),name=document.getElementById('newName').value.trim(),lane=document.getElementById('newLane').value,buttNumber=document.getElementById('newButtNumber').value.trim();if(!name)return alert('Enter a shooter name.');const p=makeShooter(name,lane===''?'':n(lane),n(s.defaultRounds),buttNumber);s.shooters.push(p);s.selected=p.id;save();render()}
function removeShooter(id){if(!confirm('Remove this shooter and their scores?'))return;const s=current();s.shooters=s.shooters.filter(p=>p.id!==id);if(s.selected===id)s.selected=s.shooters[0]?.id||'';save();render()}
function editShooter(id,k,v){const p=current().shooters.find(x=>x.id===id);if(!p)return;p[k]=['initial','extra','lane'].includes(k)?n(v):v;save();if(k==='lane'||k==='name'||k==='buttNumber')render();else refreshLive()}
function updateSession(k,v){current()[k]=k==='defaultRounds'?n(v):v;save()}
function applyRounds(){if(!confirm('Replace the initial ammunition count for all shooters in this course?'))return;const s=current();s.shooters.forEach(p=>p.initial=n(s.defaultRounds));save();render()}
function openShooter(id){current().selected=id;tab('score')}
function next(d){const s=current();if(!s.shooters.length)return;let i=s.shooters.findIndex(p=>p.id===s.selected);s.selected=s.shooters[(i+d+s.shooters.length)%s.shooters.length].id;save();render()}
function toggleRefire(checked){const p=shooter();if(!p)return;if(!checked&&Object.values(p.refireScores).some(o=>Object.values(o).some(v=>v!==''))&&!confirm('Hide the refire row? Existing refire scores will be preserved.')){render();return}p.refire=checked;save();render()}
function setScore(id,attempt,phase,field,v){const p=current().shooters.find(x=>x.id===id);if(!p)return;const dest=attempt==='initial'?p.initialScores:p.refireScores;if(!dest[phase])dest[phase]=blank();dest[phase][field]=n(v);save();refreshLive()}
function sumPhase(o){if(!o||['head','body','exterior'].some(k=>o[k]===''||o[k]==null))return '—';return ['head','body','exterior'].reduce((a,k)=>a+Number(o[k]),0)}
function progress(p){return tableList().filter(t=>{
 const rec=p.initialScores[t.id]||{};
 return t.areas.filter(a=>a.mode!=='sum').every(a=>(rec[a.id]??'')!=='');
}).length}
function total(p){return (Number(p.initial)||0)+(Number(p.extra)||0)}
function clearAll(){const s=current();if(!s)return;const ok=confirm('CLEAR ALL for '+db.weapon+' '+db.course+'?\n\nThis permanently deletes all shooters, lanes, scores, refires and ammunition for this course. Other courses will not be affected.');if(!ok)return;const sure=prompt('Type CLEAR to confirm:');if(sure!=='CLEAR')return;db.sessions[sid(db.weapon,db.course)]=makeSession();db.sessions[sid(db.weapon,db.course)].template=JSON.parse(JSON.stringify(selectedCourse()));db.sessions[sid(db.weapon,db.course)].defaultRounds=selectedCourse()?.defaultRounds||0;db.view='roster';save();render()}
function dashboard(){return `<h2 class="dashboard-title">Dashboard</h2><section class="dashboard-section"><button class="dashboard-card" onclick="toggleDashboardSection('weapon')"><span class="dash-icon">◎</span><span class="dash-copy"><strong>Select Weapon System</strong><small>${db.weapon?'Selected: '+safe(db.weapon):'Choose M18, M4A1, or another weapon.'}</small></span><span class="dash-chevron">›</span></button>${dashboardSection==='weapon'?`<div class="panel"><h2>Choose weapon system</h2><div class="weapons">${WEAPONS.map((w,i)=>`<button class="${db.weapon===w?'selected active':''}" onclick="chooseWeapon(WEAPONS[${i}])">${safe(w)}</button>`).join('')}</div></div>`:''}<button class="dashboard-card" onclick="toggleDashboardSection('course')"><span class="dash-icon">⊕</span><span class="dash-copy"><strong>Select Course</strong><small>${selectedCourse()?'Selected: '+safe(selectedCourse().name):'Choose and start a qualification course.'}</small></span><span class="dash-chevron">›</span></button>${dashboardSection==='course'?`<div class="panel"><h2>${db.weapon?safe(db.weapon)+' courses':'Select a weapon first'}</h2>${db.weapon?`<div class="courses">${availableCourses(db.weapon).map(c=>`<button class="${db.course===c.id?'selected active':''}" onclick="chooseCourse('${c.id}')">${safe(c.name)}</button>`).join('')||'<p class="muted">No courses assigned. Use Course Editor to assign one.</p>'}</div>${selectedCourse()?`<div class="dashboard-selection"><p class="muted">${safe(selectedCourse().notes)}</p><button class="primary dashboard-action" onclick="openCourse()">${db.sessions[sessionKey()]?'Continue':'Start'} ${safe(selectedCourse().name)} →</button></div>`:''}`:'<p class="muted">Select a weapon system above to see its courses.</p>'}</div>`:''}<button class="dashboard-card" onclick="tab('active')"><span class="dash-icon">♟</span><span class="dash-copy"><strong>Active Courses</strong><small>Open, manage, or delete saved classes (${Object.keys(db.sessions).length}).</small></span><span class="dash-chevron">›</span></button><button class="dashboard-card" onclick="tab('editor')"><span class="dash-icon">⚙</span><span class="dash-copy"><strong>Course Editor</strong><small>Create and manage reusable course templates.</small></span><span class="dash-chevron">›</span></button><button class="dashboard-card" onclick="tab('weapons')"><span class="dash-icon">✎</span><span class="dash-copy"><strong>Manage Weapon Systems</strong><small>Add or remove weapons available at this location.</small></span><span class="dash-chevron">›</span></button></section>`}
let dashboardSection='';
function toggleDashboardSection(section){dashboardSection=dashboardSection===section?'':section;render()}

function activeCourses(){return `<section class="panel"><div class="row between"><h2>Active Courses</h2><button onclick="home()">⌂ Dashboard</button></div><p class="muted">Manage saved class sessions. Deleting a class does not delete its course template.</p>${Object.entries(db.sessions).length?Object.entries(db.sessions).map(([k,s])=>`<div class="entry row between"><span><strong>${safe(k.split('|')[0])} • ${safe(s.template?.name||courseById(k.split('|')[1])?.name||'Legacy course')}</strong><div class="muted">${s.shooters.length} shooter(s) • ${safe(s.date||'Date not set')}</div></span><div class="row"><button class="primary" onclick="resume('${safe(k)}')">Open</button><button class="danger" onclick="deleteSession('${safe(k)}')" aria-label="Delete saved class">Delete</button></div></div>`).join(''):'<p class="muted">No active courses yet. Start a course from the dashboard.</p>'}</section>`}

function manageWeapons(){
 const used=w=>Object.entries(db.sessions).filter(([k])=>k.startsWith(w+'|')).length;
 return `<section class="panel"><div class="row between"><h2>Manage Weapon Systems</h2><button onclick="home()">⌂ Home</button></div><p class="muted">Choose which weapons are available at this location. Removing a weapon hides it from selection and the Course Editor, but does not delete saved classes or course templates.</p>
 ${WEAPONS.map((w,i)=>`<div class="entry row between"><div><strong>${safe(w)}</strong><div class="muted">${db.courses.filter(c=>c.weapons.includes(w)).length} assigned course templates • ${used(w)} saved classes</div></div><button class="danger" onclick="removeWeapon(${i})">Remove</button></div>`).join('')||'<p class="muted">No weapon systems configured.</p>'}
 <h3 style="margin-top:18px">Add Weapon System</h3><div class="row"><label style="flex:1">Weapon name<input id="newWeaponName" maxlength="70" placeholder="e.g., M249"></label><button class="primary" onclick="addWeapon()">+ Add</button></div><p class="muted">After adding a weapon, open Course Editor and assign existing or new course templates to it.</p></section>`;
}
function addWeapon(){
 const el=document.getElementById('newWeaponName');const name=el?.value.trim().replace(/\s+/g,' ');
 if(!name)return alert('Enter a weapon system name.');
 if(WEAPONS.some(w=>w.toLowerCase()===name.toLowerCase()))return alert('That weapon system already exists.');
 WEAPONS.push(name);save();render();
}
function removeWeapon(i){
 const name=WEAPONS[i];if(!name)return;
 const saved=Object.keys(db.sessions).filter(k=>k.startsWith(name+'|')).length;
 if(!confirm('Remove '+name+' from this location?'+(saved?'\n\n'+saved+' saved class(es) will be preserved under Active Courses.':'')+'\n\nCourse templates and scoring data will NOT be deleted.'))return;
 WEAPONS.splice(i,1);
 if(db.weapon===name){db.weapon='';db.course='';dashboardSection='';}
 save();render();
}

function editor(){return `<section class="panel"><div class="row between"><h2>Course Library</h2><div class="row"><button onclick="home()">⌂ Home</button><button class="primary" onclick="newCourse()">+ New Course</button></div></div><p class="muted">Templates are editable. M18 DQC (Preloaded) contains the DAFMAN scoring thresholds; other starter courses may contain placeholders. Changes affect new classes only.</p>${db.courses.map(c=>`<div class="entry"><div class="row between"><div><strong>${safe(c.name)}</strong><div class="muted">${c.weapons.map(safe).join(', ')||'No weapons assigned'} • ${c.phases.length} tables • v${c.version||1}</div></div><div class="row"><button onclick="editCourse('${c.id}')">Edit</button><button onclick="duplicateCourse('${c.id}')">Copy</button><button onclick="deleteCourse('${c.id}')">×</button></div></div></div>`).join('')}</section><section class="panel"><h3>Course library backup</h3><div class="row"><button onclick="exportLibrary()">Export templates</button><label style="flex:1">Import templates<input type="file" accept="application/json,.json" onchange="importLibrary(this.files[0])"></label></div><p class="muted">Save a backup to Files. Templates are stored on this device, not in GitHub.</p></section>`}
function newCourse(){const c={id:'c'+uid(),name:'New Course',weapons:[],phases:[normalizeTable({id:'p'+uid(),name:'Table 1',rounds:'',areas:[newArea('Scoring Area 1')]})],defaultRounds:0,notes:'Custom template',version:1};db.courses.push(c);db.editing=c.id;db.view='edit';save();render()}
function editCourse(id){db.editing=id;db.view='edit';save();render()}
function duplicateCourse(id){const c=courseById(id);if(!c)return;const d=JSON.parse(JSON.stringify(c));d.id='c'+uid();d.name=c.name+' Copy';d.version=1;db.courses.push(d);db.editing=d.id;db.view='edit';save();render()}
function deleteCourse(id){if(!confirm('Delete this course template from the library? Existing class scores will remain saved.'))return;db.courses=db.courses.filter(c=>c.id!==id);if(db.course===id)db.course='';db.view='editor';save();render()}
function updateTemplate(k,v){const c=courseById(db.editing);if(!c)return;c[k]=k==='defaultRounds'?n(v):v;c.version=(c.version||1)+1;save()}
function toggleWeapon(w,checked){const c=courseById(db.editing);if(!c)return;c.weapons=checked?[...new Set([...c.weapons,w])]:c.weapons.filter(x=>x!==w);c.version++;save()}
function updatePhase(id,k,v){const c=courseById(db.editing);const t=c?.phases.find(x=>x.id===id);if(!t)return;t[k]=k==='rounds'?(v===''?'':n(v)):v;c.version++;save()}
function addPhase(){const c=courseById(db.editing);if(!c)return;c.phases.push(normalizeTable({id:'p'+uid(),name:'Table '+(c.phases.length+1),rounds:'',areas:[newArea('Scoring Area 1')]}));c.version++;save();render()}
function removePhase(id){const c=courseById(db.editing);if(!c||c.phases.length===1)return alert('A course must have at least one table.');if(!confirm('Remove this table from the template?'))return;c.phases=c.phases.filter(x=>x.id!==id);c.version++;save();render()}
function editArea(tableId,areaId,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a[k]=['qual','expert'].includes(k)?(v===''?'':n(v)):v;if(k==='mode'&&v==='sum'&&!a.sources)a.sources=[];c.version++;save();if(k==='mode')render()}
function addArea(tableId){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;t.areas.push(newArea('Scoreable Area '+(t.areas.length+1)));c.version++;save();render()}
function removeArea(tableId,areaId){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t||t.areas.length===1)return alert('Keep at least one scoring area.');if(!confirm('Remove this scoreable area?'))return;t.areas=t.areas.filter(x=>x.id!==areaId);t.areas.forEach(a=>a.sources=(a.sources||[]).filter(x=>x!==areaId));c.version++;save();render()}
function toggleSource(tableId,areaId,sourceId,checked){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a.sources=checked?[...new Set([...(a.sources||[]),sourceId])]:(a.sources||[]).filter(x=>x!==sourceId);c.version++;save()}
function toggleAreaCount(tableId,areaId,k,checked){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a[k]=checked;c.version++;save()}
function setTableTime(tableId,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;t.time[k]=k==='seconds'?(v===''?'':n(v)):v;c.version++;save();if(k==='enabled')render()}
function addScoringPhase(tableId){
 const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;
 t.scoringPhases.push({id:'sp'+uid(),name:'Phase '+(t.scoringPhases.length+1),time:{enabled:false,seconds:''},areas:[newArea('Scoring Area 1')]});
 c.version++;save();render();
}
function removeScoringPhase(tableId,phaseId){
 const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;
 if(t.scoringPhases.length<2)return alert('Keep at least one Phase per Table.');
 if(!confirm('Remove this Phase and its scoring fields?'))return;
 t.scoringPhases=t.scoringPhases.filter(p=>p.id!==phaseId);c.version++;save();render();
}
function editScoringPhase(tableId,phaseId,name){
 const c=courseById(db.editing),ph=c?.phases.find(t=>t.id===tableId)?.scoringPhases.find(p=>p.id===phaseId);
 if(ph){ph.name=name;c.version++;save()}
}
function setPhaseTime(tableId,phaseId,k,v){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId);if(!ph)return;
 if(!ph.time)ph.time={enabled:false,seconds:''};
 ph.time[k]=k==='seconds'?(v===''?'':n(v)):v;c.version++;save();if(k==='enabled')render();
}
function findEditorPhase(tableId,phaseId){
 return courseById(db.editing)?.phases.find(t=>t.id===tableId)?.scoringPhases.find(p=>p.id===phaseId);
}
function editScoringArea(tableId,phaseId,areaId,k,v){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId),a=ph?.areas.find(x=>x.id===areaId);if(!a)return;
 a[k]=['qual','expert'].includes(k)?(v===''?'':n(v)):v;
 if(k==='mode'&&v==='sum')a.sources=a.sources||[];
 c.version++;save();if(k==='mode')render();
}
function addScoringArea(tableId,phaseId){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId);if(!ph)return;
 ph.areas.push(newArea('Scoring Area '+(ph.areas.length+1)));c.version++;save();render();
}
function removeScoringArea(tableId,phaseId,areaId){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId);if(!ph)return;
 if(ph.areas.length<2)return alert('Keep at least one scoring area.');
 ph.areas=ph.areas.filter(a=>a.id!==areaId);
 ph.areas.forEach(a=>a.sources=(a.sources||[]).filter(id=>id!==areaId));
 c.version++;save();render();
}
function setScoringAreaCount(tableId,phaseId,areaId,checked){
 const c=courseById(db.editing),a=findEditorPhase(tableId,phaseId)?.areas.find(a=>a.id===areaId);
 if(a){a.countScore=checked;c.version++;save()}
}
function setScoringSource(tableId,phaseId,areaId,sourceId,checked){
 const c=courseById(db.editing),a=findEditorPhase(tableId,phaseId)?.areas.find(a=>a.id===areaId);
 if(a){a.sources=checked?[...new Set([...(a.sources||[]),sourceId])]:(a.sources||[]).filter(id=>id!==sourceId);c.version++;save()}
}
function updateTableRule(id,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===id);if(!t)return;t[k]=v===''?'':n(v);c.version++;save()}
function editForm(){
 const c=courseById(db.editing);if(!c)return editor();
 return `<section class="panel"><div class="row between"><h2>Course Editor</h2><button onclick="tab('editor')">Done ✓</button></div>
 <label>Course name<input value="${attr(c.name)}" onchange="updateTemplate('name',this.value)"></label>
 <p class="muted">Available for these weapons:</p><div class="grid">${WEAPONS.map((w,i)=>`<label class="row" style="display:flex"><input type="checkbox" style="width:20px" ${c.weapons.includes(w)?'checked':''} onchange="toggleWeapon(WEAPONS[${i}],this.checked)">${safe(w)}</label>`).join('')}</div>
 <label>Default ammunition<input type="number" min="0" value="${c.defaultRounds||0}" onchange="updateTemplate('defaultRounds',this.value)"></label></section>
 ${c.phases.map(t=>`<section class="panel"><div class="row between"><h2>Firing Table: ${safe(t.name)}</h2><button onclick="removePhase('${t.id}')">Remove Table</button></div>
 <div class="grid"><label>Firing Table name<input value="${attr(t.name)}" onchange="updatePhase('${t.id}','name',this.value)"></label>
 <label>Rounds fired<input type="number" min="0" value="${attr(t.rounds)}" onchange="updatePhase('${t.id}','rounds',this.value)"></label>
 <label>Minimum qualifying hits (Table)<input type="number" min="0" placeholder="Optional" value="${attr(t.qualMin)}" onchange="updateTableRule('${t.id}','qualMin',this.value)"></label>
 <label>Minimum Expert qualifying hits (Table)<input type="number" min="0" placeholder="Optional" value="${attr(t.expertTotal)}" onchange="updateTableRule('${t.id}','expertTotal',this.value)"></label></div>
 <p class="muted">Score the target once after the entire Table. Qualifying Hits counts checked manual areas; Total Hits on Paper counts all manual areas. Do not create overlapping manual areas.</p>
 <h3>Editable Scoreable Areas</h3>
 ${t.areas.map(a=>`<div class="areaedit"><div class="row between"><strong>${safe(a.name)}</strong><button onclick="removeArea('${t.id}','${a.id}')">×</button></div>
 <div class="grid"><label>Scoreable area name<input value="${attr(a.name)}" onchange="editArea('${t.id}','${a.id}','name',this.value)"></label>
 <label>Entry type<select onchange="editArea('${t.id}','${a.id}','mode',this.value)"><option value="manual" ${a.mode!=='sum'?'selected':''}>Manual hits</option><option value="sum" ${a.mode==='sum'?'selected':''}>Calculated Total</option></select></label>
 <label>Minimum qualifying hits (area)<input type="number" min="0" placeholder="Optional" value="${attr(a.qual)}" onchange="editArea('${t.id}','${a.id}','qual',this.value)"></label>
 <label>Minimum Expert hits (area)<input type="number" min="0" placeholder="Optional" value="${attr(a.expert)}" onchange="editArea('${t.id}','${a.id}','expert',this.value)"></label></div>
 ${a.mode!=='sum'?`<label class="row" style="display:flex;margin-top:10px"><input type="checkbox" style="width:20px" ${a.countScore?'checked':''} onchange="toggleAreaCount('${t.id}','${a.id}','countScore',this.checked)"> Include in Qualifying Hits</label>`:
 `<p class="muted">Add these manual areas:</p>${t.areas.filter(x=>x.id!==a.id&&x.mode!=='sum').map(x=>`<label class="row" style="display:flex"><input type="checkbox" style="width:20px" ${(a.sources||[]).includes(x.id)?'checked':''} onchange="toggleSource('${t.id}','${a.id}','${x.id}',this.checked)">${safe(x.name)}</label>`).join('')}`}
 </div>`).join('')}
 <button onclick="addArea('${t.id}')">+ Add Scoreable Area</button></section>`).join('')}
 <section class="panel"><button class="primary" onclick="addPhase()">+ Add Table</button><p><button onclick="tab('editor')">Save and return to library</button></p><p class="muted">Saved automatically. Existing class sessions keep their original course snapshot.</p></section>`;
}
function exportLibrary(){const blob=new Blob([JSON.stringify({type:'catm-course-library',version:1,courses:db.courses},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='catm-course-library.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importLibrary(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.type!=='catm-course-library'||!Array.isArray(obj.courses)||!obj.courses.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.weapons)&&Array.isArray(c.phases)&&c.phases.length))throw Error('Not a valid CATM course library');if(!confirm('Replace all saved course templates with this backup? Existing class scores will remain unchanged.'))return;db.courses=obj.courses.map(normalizeCourse);db.course='';save();render();alert('Templates imported successfully.')}catch(e){alert('Import failed: '+e.message)}}

function deleteSession(key){
 const s=db.sessions[key];if(!s)return;
 const label=(s.template?.name||'Saved class')+' ('+key.split('|')[0]+')';
 if(!confirm('Delete saved class: '+label+'?\n\nThis permanently deletes all shooters, scores, refires, and ammunition for this class. The reusable course template and other saved classes will not be affected.'))return;
 if(prompt('Type DELETE to permanently remove this saved class:')!=='DELETE')return;
 delete db.sessions[key];
 if(sessionKey()===key){db.course='';}
 db.view='active';save();render();
}
function completeCourse(){
 const key=sessionKey(),session=current();
 if(!session)return alert('No active class is open.');
 const name=session.template?.name||selectedCourse()?.name||'Course';
 if(!confirm('Complete and remove this class?\\n\\n'+name+' ('+db.weapon+')\\n'+session.shooters.length+' shooter(s)\\n\\nThis permanently deletes the saved class, including all scores, shooters, refires and ammunition records. Course templates and other classes are preserved.'))return;
 delete db.sessions[key];
 db.weapon='';db.course='';db.view='home';
 save();render();
}
function resume(key){const i=key.indexOf('|');db.weapon=key.slice(0,i);db.course=key.slice(i+1);openCourse()}
function roster(){const s=current();return `<section class="panel"><div class="row between"><h2>${safe(db.weapon)} • ${safe(current()?.template?.name||selectedCourse()?.name||db.course)}</h2><span class="tag">Scoring test V16</span></div><div class="grid"><label>Class date<input type="date" value="${safe(s.date)}" onchange="updateSession('date',this.value)"></label><label>Default initial rounds<input type="number" min="0" value="${s.defaultRounds}" onchange="updateSession('defaultRounds',this.value)"></label></div><p><button onclick="applyRounds()">Apply rounds to all</button></p><div class="notice">Course names and ammunition defaults may be placeholders. Table status reflects configured minimums only; verify official qualification and refire rules.</div></section><section class="panel"><h2>Class shooters (${s.shooters.length})</h2>${s.shooters.map(p=>`<div class="entry row between"><div><strong>${safe(p.name)}</strong><div class="muted">Lane ${safe(p.lane||'Unassigned')} • Butt # ${safe(p.buttNumber||'—')} • ${progress(p)}/${tableList().length} Tables completed • ${total(p)} rounds</div></div><div class="row"><button class="primary" onclick="openShooter('${p.id}')">Score</button><button onclick="removeShooter('${p.id}')" aria-label="Remove shooter">×</button></div></div>`).join('')||'<p class="muted">No shooters yet. Add a fictional shooter below.</p>'}<h3 style="margin-top:17px">Add shooter</h3><div class="grid"><label>Name<input id="newName" placeholder="Fictional name"></label><label>Lane<input id="newLane" type="number" min="1" placeholder="Lane number"></label><label>Weapon Butt # (optional)<input id="newButtNumber" type="text" placeholder="e.g., 12" autocomplete="off"></label></div><p><button class="primary" onclick="addShooter()">Add shooter</button></p></section>`}
function phaseCell(p,attempt,phase){const obj=(attempt==='initial'?p.initialScores:p.refireScores)[phase]||blank();return `<td>${['head','body','exterior'].map(k=>`<label class="cellfield"><span>${k==='exterior'?'Exterior':k==='head'?'Head':'Body'}</span><input type="number" min="0" inputmode="numeric" placeholder="—" value="${safe(obj[k])}" oninput="setScore('${p.id}','${attempt}','${phase}','${k}',this.value)"></label>`).join('')}<div class="overall"><strong>Overall</strong><strong id="sum-${attempt}-${phase.replace(' ','')}">${sumPhase(obj)}</strong></div></td>`}
function score(){
 const p=shooter();if(!p)return `<section class="panel"><h2>No shooters</h2><p>Add a shooter first.</p><button onclick="tab('roster')">Go to shooters</button></section>`;
 return `<section class="panel"><div class="row between"><h2>${safe(p.name)}</h2><span class="tag">${safe(db.weapon)} • ${safe(current()?.template?.name||db.course)}</span></div>
 <div class="grid"><label>Weapon Butt #<input type="text" value="${safe(p.buttNumber||'')}" placeholder="Optional" onchange="editShooter('${p.id}','buttNumber',this.value)"></label><label>Lane<input type="number" min="1" value="${safe(p.lane)}" onchange="editShooter('${p.id}','lane',this.value)"></label>
 <label>Initial rounds<input type="number" min="0" value="${safe(p.initial)}" oninput="editShooter('${p.id}','initial',this.value)"></label>
 <label>Additional rounds<input type="number" min="0" value="${safe(p.extra)}" oninput="editShooter('${p.id}','extra',this.value)"></label></div>
 <p><strong id="roundTotal">Total ammunition: ${total(p)} rounds</strong></p></section>
 ${tableList().map(t=>`<section class="panel"><h2>Firing Table: ${safe(t.name)}</h2><p class="muted">${t.rounds===''?'Rounds not configured':safe(t.rounds)+' rounds'} • Scored once after completing this Table</p>
 <div class="scroll"><table class="scoretable dynamic"><thead><tr><th>Attempt</th>
 ${t.areas.map(a=>`<th>${safe(a.name)}${a.qual!==''?`<small>Qual ≥${safe(a.qual)}</small>`:''}${a.expert!==''?`<small>Expert ≥${safe(a.expert)}</small>`:''}</th>`).join('')}<th>Status</th></tr></thead><tbody>
 ${['initial',...(refireEligible(p,t)?['refire']:[])].map(at=>`<tr><td>${at==='initial'?'Initial':'Refire'}</td>
 ${t.areas.map(a=>`<td>${a.mode==='sum'?`<strong class="calculated" data-calc="${at}-${t.id}-${a.id}">${areaValue(attemptRecord(p,at,t),t,a)===''?'—':areaValue(attemptRecord(p,at,t),t,a)}</strong>`:
 `<input type="number" min="0" inputmode="numeric" placeholder="—" value="${safe(attemptRecord(p,at,t)[a.id]??'')}" oninput="setAreaScore('${p.id}','${at}','${t.id}','${a.id}',this.value)">`}</td>`).join('')}
 <td><strong data-status="${at}-${t.id}">${tableStatus(p,at,t)}</strong></td></tr>`).join('')}</tbody></table></div>
 ${['initial',...(refireEligible(p,t)?['refire']:[])].map(at=>{const v=scoreTotals(attemptRecord(p,at,t),t);return `<div class="row between" style="margin-top:8px"><span>${at==='initial'?'Initial':'Refire'}</span><span>Qualifying Hits: <strong data-qual-total="${at}-${t.id}">${v.qualifying===''?'—':v.qualifying}</strong> | Total Hits on Paper: <strong data-paper-total="${at}-${t.id}">${v.paper===''?'—':v.paper}</strong> | Expert: <strong data-expert="${at}-${t.id}">${evaluateExpert(p,at,t)?'Expert':'—'}</strong></span></div>`}).join('')}
 </section>`).join('')}
 ${overallSummary(p)}
 <section class="panel"><p class="muted">Refire entries appear automatically only for failed Firing Tables. Once a refire is fully scored, its results replace that Table's initial results in the overall evaluation.</p>
 <div id="scoreProgress" class="muted">${progress(p)}/${tableList().length} Tables completed</div></section>
 <section class="panel row between"><button onclick="next(-1)">← Previous</button><button class="primary" onclick="next(1)">Next shooter →</button></section>`;
}
function totals(){const s=current();return `<section class="panel"><h2>Course totals</h2><p style="font-size:30px;margin:0"><strong>${s.shooters.reduce((a,p)=>a+total(p),0)}</strong> <span class="muted">rounds</span></p><p class="muted">${s.shooters.length} shooters • ${safe(db.weapon)} ${safe(db.course)} • ${safe(s.date)}</p></section><section class="panel"><h2>Shooter progress</h2>${s.shooters.map(p=>`<div class="entry row between"><div><strong>${safe(p.name)}</strong><div class="muted">Lane ${safe(p.lane||'—')} • Butt # ${safe(p.buttNumber||'—')} • ${progress(p)}/${tableList().length} initial Tables • Failed Tables eligible for refire: ${tableList().filter(t=>refireEligible(p,t)).length}</div></div><strong>${total(p)} rds</strong></div>`).join('')||'<p class="muted">No shooters added.</p>'}</section><section class="panel dangerarea"><h2>Complete Course</h2><p class="muted">Finished with this class? Remove it from Active Courses and return to the dashboard. This permanently deletes its shooter records and scores, so export or record any results you need before continuing.</p><button class="danger" onclick="completeCourse()">Complete Course</button></section><section class="panel dangerarea"><h2>Reset this class</h2><p class="muted">Deletes all shooters, lane assignments, scores, refires and ammunition for this weapon/course only. Other course sessions remain saved.</p><button class="danger" onclick="clearAll()">Clear All</button></section>`}
function refreshLive(){
 const p=shooter();if(!p)return;
 const r=document.getElementById('roundTotal');if(r)r.textContent='Total ammunition: '+total(p)+' rounds';
 const x=document.getElementById('scoreProgress');if(x)x.textContent=progress(p)+'/'+tableList().length+' Tables completed';
 for(const t of tableList())for(const at of ['initial','refire']){
 const rec=attemptRecord(p,at,t);
 for(const a of t.areas){const e=document.querySelector(`[data-calc="${at}-${t.id}-${a.id}"]`);if(e){const v=areaValue(rec,t,a);e.textContent=v===''?'—':v}}
 const sums=scoreTotals(rec,t);
 for(const [key,val] of [['qual-total',sums.qualifying],['paper-total',sums.paper]]){const e=document.querySelector(`[data-${key}="${at}-${t.id}"]`);if(e)e.textContent=val===''?'—':val}
 const st=document.querySelector(`[data-status="${at}-${t.id}"]`);if(st)st.textContent=tableStatus(p,at,t);
 const ex=document.querySelector(`[data-expert="${at}-${t.id}"]`);if(ex)ex.textContent=evaluateExpert(p,at,t)?'Expert':'—';
 }
 const coursePaper=document.querySelector('[data-course-paper="initial"]');if(coursePaper){const value=effectivePaperTotal(p);coursePaper.textContent=value===''?'—':value;}
 const courseStatus=document.querySelector('[data-course-status]');if(courseStatus)courseStatus.textContent=overallStatus(p);
}
function render(){const isHome=db.view==='home'||((db.view!=='editor'&&db.view!=='edit'&&db.view!=='active'&&db.view!=='weapons')&&!current());document.getElementById('nav').innerHTML=(isHome||db.view==='editor'||db.view==='edit'||db.view==='active'||db.view==='weapons')?'':`<button onclick="home()">⌂ Home</button><button class="${db.view==='roster'?'active':''}" onclick="tab('roster')">Shooters</button><button class="${db.view==='score'?'active':''}" onclick="tab('score')">Score</button><button class="${db.view==='totals'?'active':''}" onclick="tab('totals')">Totals</button>`;document.getElementById('app').innerHTML=db.view==='editor'?editor():db.view==='edit'?editForm():db.view==='active'?activeCourses():db.view==='weapons'?manageWeapons():isHome?dashboard():({roster,score,totals}[db.view]||roster)()}
render();
</script></body></html>
