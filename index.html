<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATM Scoring</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#eef2f6;color:#15283c}*{box-sizing:border-box}body{margin:0}header{background:#14283e;color:white;padding:20px}main{max-width:780px;margin:auto;padding:14px}.panel{background:white;border-radius:14px;padding:16px;margin-bottom:12px}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 9px}p{line-height:1.45}.muted{color:#64758a;font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select{width:100%;padding:11px;border:1px solid #bfcbd8;border-radius:9px;font:inherit;background:white}button{border:0;border-radius:9px;padding:11px 13px;background:#dce6ef;color:#14283e;font:inherit;font-weight:650;cursor:pointer}button.primary{background:#215d8e;color:white}button.active{background:#14283e;color:white}button:disabled{opacity:.45}.tabs{display:flex;gap:8px;margin-bottom:13px}.tabs button{flex:1}.entry{padding:12px;border:1px solid #dce3ec;border-radius:10px;margin-top:8px}.tag{font-size:12px;border-radius:15px;background:#e8eff6;padding:4px 8px}.good{color:#146448}.warn{color:#9c5c13}.danger{color:#a52e30}.small{font-size:12px}.footer{text-align:center;padding:10px;color:#667788;font-size:12px}@media print{header,.tabs,button,.no-print,.footer{display:none!important}body{background:white}.panel{box-shadow:none}main{max-width:none}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:10px;text-align:left}}</style></head><body><header><h1>CATM Qualification Scoring</h1><div class="small">Prototype • fictional sample data • stored locally in this browser</div></header><main><div class="tabs"><button id="rosterTab" onclick="switchTab('roster')">Class roster</button><button id="scoreTab" onclick="switchTab('score')">Score shooter</button><button id="totalsTab" onclick="switchTab('totals')">Totals</button></div><div id="app"></div><div class="footer">Demo only. Official course scoring criteria must be verified before operational use. Do not enter real personnel information.</div></main><script>
'use strict';
const KEY='catm-score-only-v1';const seed={course:'M18 DQC',date:new Date().toISOString().slice(0,10),defaultRounds:50,tab:'roster',selected:'a',shooters:[{id:'a',name:'Alex Morgan',lane:1,initial:50,extra:0,scores:{},refire:null},{id:'b',name:'Jordan Lee',lane:2,initial:50,extra:0,scores:{},refire:null},{id:'c',name:'Taylor Reed',lane:3,initial:50,extra:0,scores:{},refire:null}]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){db=seed}if(!Array.isArray(db.shooters))db=seed;
const el=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),persist=()=>localStorage.setItem(KEY,JSON.stringify(db)),who=()=>db.shooters.find(s=>s.id===db.selected)||db.shooters[0],total=s=>(Number(s.initial)||0)+(Number(s.extra)||0),num=(x)=>x===''?'':Math.max(0,Number(x)||0);
const phases=[{key:'p1',name:'Phase 1',detail:'Enter phase score when reported'},{key:'p2',name:'Phase 2',detail:'Enter phase score when reported'},{key:'p3',name:'Phase 3',detail:'Enter phase score when reported'}];
function switchTab(t){db.tab=t;persist();render()}function field(k,v){db[k]=k==='defaultRounds'?num(v):v;persist();render()}function addShooter(){const name=el('newName').value.trim(),lane=el('newLane').value;if(!name)return;const id='s'+Date.now().toString(36);db.shooters.push({id,name,lane:lane===''?'':Number(lane),initial:Number(db.defaultRounds)||0,extra:0,scores:{},refire:null});db.selected=id;persist();render()}function editShooter(id,k,v){const s=db.shooters.find(x=>x.id===id);if(!s)return;s[k]=['initial','extra','lane'].includes(k)?num(v):v;persist();if(k==='name'||k==='lane')render()}function openShooter(id){db.selected=id;switchTab('score')}function next(n){let i=db.shooters.findIndex(s=>s.id===db.selected);db.selected=db.shooters[(i+n+db.shooters.length)%db.shooters.length]?.id;persist();render()}function setScore(id,phase,v,refire=false){let s=db.shooters.find(x=>x.id===id);if(!s)return;let obj=refire?s.refire:s.scores;if(!obj)return;obj[phase]=num(v);persist();updateStatus()}function startRefire(){let s=who();if(s&&!s.refire&&confirm('Create one separate course refire record for this shooter?')){s.refire={};persist();render()}}function removeShooter(id){if(!confirm('Remove this sample shooter from the class?'))return;db.shooters=db.shooters.filter(s=>s.id!==id);if(db.selected===id)db.selected=db.shooters[0]?.id;persist();render()}function setAllRounds(){if(!confirm('Set the initial rounds for every shooter to the class default? This replaces individual initial-round adjustments.'))return;db.shooters.forEach(s=>s.initial=Number(db.defaultRounds)||0);persist();render()}
function roster(){return `<section class="panel"><h2>Class details</h2><div class="grid"><label>Course<input value="${safe(db.course)}" onchange="field('course',this.value)"></label><label>Date<input type="date" value="${safe(db.date)}" onchange="field('date',this.value)"></label><label>Default initial rounds<input type="number" min="0" value="${db.defaultRounds}" onchange="field('defaultRounds',this.value)"></label></div><p class="row"><button onclick="setAllRounds()">Apply default rounds to all</button><button onclick="printRoster()">Print attendance roster / PDF</button></p></section><section class="panel"><h2>Class roster (${db.shooters.length})</h2>${db.shooters.map(s=>`<div class="entry row between"><div><strong>${safe(s.name)}</strong><div class="muted">Lane ${safe(s.lane||'Not assigned')} • ${total(s)} rounds • ${Object.keys(s.scores||{}).filter(k=>s.scores[k]!==''&&s.scores[k]!=null).length}/3 phases entered</div></div><div class="row"><button class="primary" onclick="openShooter('${s.id}')">Score</button><button onclick="removeShooter('${s.id}')" aria-label="Remove shooter">×</button></div></div>`).join('')}<h3 style="margin-top:18px">Add shooter</h3><div class="grid"><label>Name<input id="newName" placeholder="Name"></label><label>Lane assigned today<input id="newLane" type="number" min="1" placeholder="Lane"></label></div><p><button class="primary" onclick="addShooter()">Add to class</button></p></section>`}
function score(){const s=who();if(!s)return `<section class="panel">Add a shooter in Class roster first.</section>`;return `<section class="panel"><div class="row between"><h2>${safe(s.name)}</h2><span class="tag">${safe(db.course)}</span></div><div class="grid"><label>Lane<input type="number" min="1" value="${safe(s.lane)}" onchange="editShooter('${s.id}','lane',this.value)"></label><label>Initial rounds<input type="number" min="0" value="${safe(s.initial)}" oninput="editShooter('${s.id}','initial',this.value);updateStatus()"></label><label>Additional rounds<input type="number" min="0" value="${safe(s.extra)}" oninput="editShooter('${s.id}','extra',this.value);updateStatus()"></label></div><p><strong id="roundStatus">Total rounds: ${total(s)}</strong></p></section><section class="panel"><h2>Original course scores</h2><p class="muted">Enter phases in any order. Empty fields remain unscored.</p>${phases.map(p=>`<div class="entry"><label>${p.name}<input type="number" min="0" placeholder="Not yet scored" value="${safe(s.scores?.[p.key]??'')}" oninput="setScore('${s.id}','${p.key}',this.value)"></label></div>`).join('')}<p id="scoreStatus" class="muted"></p></section><section class="panel"><div class="row between"><h2>Course refire</h2><button ${s.refire?'disabled':''} onclick="startRefire()">${s.refire?'Refire recorded':'Start refire'}</button></div>${s.refire?`<p class="muted">Enter only the phases refired. Original scores are preserved.</p>${phases.map(p=>`<div class="entry"><label>${p.name} refire score<input type="number" min="0" placeholder="Not refired" value="${safe(s.refire?.[p.key]??'')}" oninput="setScore('${s.id}','${p.key}',this.value,true)"></label></div>`).join('')}`:'<p class="muted">One course refire record can be added. Official refire eligibility is not determined by this prototype.</p>'}</section><section class="panel row between"><button onclick="next(-1)">← Previous shooter</button><button class="primary" onclick="next(1)">Next shooter →</button></section>`}
function totals(){let sum=db.shooters.reduce((a,s)=>a+total(s),0);return `<section class="panel"><h2>Class totals</h2><p><strong style="font-size:28px">${sum}</strong> rounds total</p><p class="muted">${db.shooters.length} shooters • ${safe(db.course)} • ${safe(db.date)}</p></section><section class="panel">${db.shooters.map(s=>`<div class="entry row between"><span>${safe(s.name)} (Lane ${safe(s.lane||'—')})</span><strong>${total(s)} rounds</strong></div>`).join('')}</section><section class="panel"><p class="muted">Automatic Qualified / Expert / Unqualified classification is intentionally not enabled until the exact applicable M18 DQC scoring tables and mandatory phase conditions are configured and verified.</p></section>`}
function updateStatus(){let s=who();if(!s)return;let rs=el('roundStatus');if(rs)rs.textContent='Total rounds: '+total(s);let ss=el('scoreStatus');if(ss){let count=phases.filter(p=>s.scores?.[p.key]!==''&&s.scores?.[p.key]!=null).length;ss.textContent=count+'/3 phases entered • '+(count===3?'Scores entered; official determination not configured':'In progress')}}
function render(){['roster','score','totals'].forEach(t=>el(t+'Tab').classList.toggle('active',db.tab===t));el('app').innerHTML=({roster,score,totals}[db.tab]||roster)();updateStatus()}
function printRoster(){const rows=db.shooters.map((s,i)=>`<tr><td>${i+1}</td><td>${safe(s.name)}</td><td>${safe(s.lane||'')}</td><td style="height:42px"></td></tr>`).join('');const w=window.open('','_blank');if(!w){alert('Please allow pop-ups for printing.');return}w.document.write(`<html><head><title>CATM Attendance Roster</title><style>body{font:14px Arial;margin:30px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #777;padding:9px;text-align:left}</style></head><body><h2>CATM Attendance Roster</h2><p>Course: ${safe(db.course)} | Date: ${safe(db.date)}</p><table><tr><th>#</th><th>Name</th><th>Lane</th><th>Signature</th></tr>${rows}</table><p>Instructor: ______________________________</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
render();</script></body></html>
