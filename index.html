<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14263b"><title>CATM Range Prototype</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17283a;background:#eef2f6}*{box-sizing:border-box}body{margin:0}header{background:#14263b;color:white;padding:20px 18px}header small{color:#b6c9df}h1{font-size:22px;margin:4px 0}main{max-width:1000px;margin:auto;padding:15px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:11px 13px;background:#dce5ef;color:#14263b;font-weight:650;cursor:pointer}button.primary{background:#1f5d8f;color:white}button.active{background:#14263b;color:white}button.danger{background:#fce4e4;color:#a32c2c}input,select{border:1px solid #c9d2dd;border-radius:8px;padding:10px;background:white;min-width:0;max-width:100%}.panel{background:white;border:1px solid #dce3ec;border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #1020300a}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:14px 0 8px}.muted{color:#627386;font-size:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:10px}.item{padding:12px;border:1px solid #dce3ec;border-radius:10px;margin-top:8px}.pill{display:inline-block;background:#e9f1f9;border-radius:20px;padding:4px 9px;font-size:12px}.warn{color:#a26012}.good{color:#17684e}.stat{font-size:24px;font-weight:750}label{font-size:13px;font-weight:650;display:grid;gap:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.phase{padding:12px;border:1px solid #dce3ec;border-radius:10px;margin:8px 0}.phase input{width:88px}.hide{display:none}.tiny{font-size:12px}footer{padding:15px;text-align:center;color:#667}.printonly{display:none}@media print{header,.tabs,button,.noprint,footer{display:none!important}body{background:white}.panel{border:0;box-shadow:none}.printonly{display:block}main{padding:0}.sig{height:34px;border-bottom:1px solid #777} }</style></head><body>
<header><small>WORKING DEMO • FICTIONAL PERSONNEL</small><h1>CATM Range Scheduler</h1><div class="tiny">Scheduling • class rosters • DQC scoring • round accounting</div></header><main><nav class="tabs"><button id="tab-calendar" onclick="show('calendar')">Range days</button><button id="tab-roster" onclick="show('roster')">Class roster</button><button id="tab-scoring" onclick="show('scoring')">Scoring</button><button id="tab-personnel" onclick="show('personnel')">Personnel</button></nav><div id="app"></div></main><footer>Prototype only. Scores and course rules must be validated against the applicable publication before operational use. Data stays in this browser's local storage.</footer>
<script>
const KEY='catm-prototype-v1';
const template=[{name:'Table I • BUIS zero',rounds:10,required:false},{name:'Table I • Optic zero',rounds:10,required:false},{name:'Table I • Laser zero',rounds:10,required:false},{name:'Table II • Marksmanship evaluation',rounds:30,required:true},{name:'Table II • CBRN evaluation',rounds:10,required:true},{name:'Table III • Low visibility evaluation',rounds:30,required:true},{name:'Table III • Laser evaluation',rounds:20,required:false}];
const initial={people:[{id:'p1',name:'Alex Morgan',flight:'Alpha',unavailable:''},{id:'p2',name:'Jordan Lee',flight:'Bravo',unavailable:''},{id:'p3',name:'Taylor Reed',flight:'Charlie',unavailable:''},{id:'p4',name:'Casey Rivera',flight:'Delta',unavailable:''}],days:[{id:'d1',date:'2027-01-26',status:'Draft',classes:[{id:'c1',name:'M4A1 • Carbine DQC',weapon:'M4A1',people:['p1','p2','p3'],scores:{}},{id:'c2',name:'M18 • Qualification',weapon:'M18',people:['p4'],scores:{}}]}],selectedDay:'d1',selectedClass:'c1',selectedPerson:'p1',phaseAnchor:'',tab:'calendar'};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),day=()=>db.days.find(d=>d.id===db.selectedDay),cls=()=>day()?.classes.find(c=>c.id===db.selectedClass),person=id=>db.people.find(p=>p.id===id),id=()=>Math.random().toString(36).slice(2,9);
function show(t){db.tab=t;save();render()}function setDay(v){db.selectedDay=v;db.selectedClass=day()?.classes[0]?.id;save();render()}function setClass(v){db.selectedClass=v;db.selectedPerson=cls()?.people[0];save();render()}
function addDay(){let date=$('newdate').value;if(!date)return;let d={id:id(),date,status:'Draft',classes:[]};db.days.push(d);db.selectedDay=d.id;db.selectedClass=null;save();show('roster')}
function addClass(){let n=$('classname').value.trim(),w=$('weapon').value;if(!n)return;let c={id:id(),name:n,weapon:w,people:[],scores:{}};day().classes.push(c);db.selectedClass=c.id;save();render()}
function addPersonToClass(){let p=$('pickperson').value;if(!p||cls().people.includes(p))return;cls().people.push(p);db.selectedPerson=p;save();render()}
function removeFromClass(p){cls().people=cls().people.filter(x=>x!==p);save();render()}
function addPerson(){let n=$('personname').value.trim();if(!n)return;db.people.push({id:id(),name:n,flight:$('personflight').value,unavailable:''});save();render()}
function editUnavailable(p,v){person(p).unavailable=v;save()}
function getScore(p){return cls().scores[p]||(cls().scores[p]={attempts:[{}],refire:false})}
function updateScore(p,index,key,value){let s=getScore(p),a=s.attempts[s.refire?1:0];a[index]??={};a[index][key]=Math.max(0,Number(value)||0);save();render()}
function toggleRefire(p){let s=getScore(p);if(s.refire)return;s.refire=true;s.attempts.push({});save();render()}
function summary(p){let s=getScore(p),a=s.attempts[s.refire?1:0];let total=template.reduce((x,v,i)=>x+(Number(a[i]?.fired)||0),0);let complete=template.filter(v=>v.required).every(v=>a[template.indexOf(v)]?.complete);return {total,complete,refire:s.refire}}
function calendar(){return `<section class="panel"><h2>Range calendar</h2><div class="grid"><label>Select range day<select onchange="setDay(this.value)">${db.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>`<option value="${d.id}" ${d.id===db.selectedDay?'selected':''}>${d.date} • ${d.status}</option>`).join('')}</select></label><label>Add range date<input id="newdate" type="date"></label></div><p><button class="primary" onclick="addDay()">Add range day</button></p></section>${db.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>`<section class="panel"><div class="row spread"><div><strong>${d.date}</strong> <span class="pill">${d.status}</span><div class="muted">${d.classes.length} classes • ${new Set(d.classes.flatMap(c=>c.people)).size} unique personnel</div></div><button onclick="setDay('${d.id}');show('roster')">Open day</button></div></section>`).join('')}`}
function roster(){let d=day();if(!d)return '<section class="panel">Add a range day first.</section>';let c=cls();return `<section class="panel"><div class="row spread"><h2>${d.date} • Range day</h2><button onclick="db.days.find(x=>x.id==='${d.id}').status=db.days.find(x=>x.id==='${d.id}').status==='Draft'?'Finalized':'Draft';save();render()">${d.status}</button></div><div class="grid"><label>Class<select onchange="setClass(this.value)">${d.classes.map(c=>`<option value="${c.id}" ${c.id===db.selectedClass?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>New class name<input id="classname" placeholder="e.g. M4A1 DQC"></label><label>Weapon<select id="weapon"><option>M4A1</option><option>M18</option><option>M110A1</option><option>Other</option></select></label></div><p><button onclick="addClass()">Add class</button></p></section>${c?`<section class="panel"><div class="row spread"><div><h2>${esc(c.name)}</h2><div class="muted">${c.people.length} students • ${esc(c.weapon)}</div></div><button class="primary" onclick="printRoster()">Print / Save PDF</button></div><div class="row"><select id="pickperson">${db.people.filter(p=>!c.people.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)} • ${p.flight}</option>`).join('')}</select><button onclick="addPersonToClass()">Assign student</button></div>${c.people.map(p=>`<div class="item row spread"><div><strong>${esc(person(p)?.name||'Unknown')}</strong> <span class="pill">${person(p)?.flight||''}</span>${person(p)?.unavailable?.split(',').map(x=>x.trim()).includes(d.date)?'<div class="warn">Unavailable on this date</div>':''}<div class="muted">Scheduling: flight rotation not configured yet</div></div><div class="row"><button onclick="db.selectedPerson='${p}';save();show('scoring')">Score</button><button class="danger" onclick="removeFromClass('${p}')">Remove</button></div></div>`).join('')||'<p class="muted">No students assigned yet.</p>'}</section>`:''}`}
function scoring(){let c=cls();if(!c)return '<section class="panel">Open a class and assign a student first.</section>';if(!c.people.includes(db.selectedPerson))db.selectedPerson=c.people[0];let p=db.selectedPerson;if(!p)return '<section class="panel">Assign students in Class roster first.</section>';let s=getScore(p),a=s.attempts[s.refire?1:0],sm=summary(p);return `<section class="panel"><h2>Firing-line scoring</h2><div class="grid"><label>Student<select onchange="db.selectedPerson=this.value;save();render()">${c.people.map(q=>`<option value="${q}" ${q===p?'selected':''}>${esc(person(q)?.name)}</option>`).join('')}</select></label><label>Class<input disabled value="${esc(c.name)}"></label></div><div class="row" style="margin-top:12px"><span class="pill">${s.refire?'Refire attempt':'Initial attempt'}</span><span class="pill">${sm.total} rounds recorded</span><span class="pill">${sm.complete?'Required phases marked complete':'In progress'}</span></div><p class="muted">Demo scoring template based on carbine DQC phase headings. “Complete” is a manual instructor confirmation, not an automatic regulatory qualification determination. Enter rounds fired and hits for each phase.</p></section>${template.map((v,i)=>{let r=a[i]||{};return `<section class="panel"><div class="row spread"><strong>${esc(v.name)}</strong><span class="pill">${v.rounds} planned rounds</span></div><div class="grid" style="margin-top:10px"><label>Rounds fired<input type="number" min="0" value="${r.fired??''}" onchange="updateScore('${p}',${i},'fired',this.value)"></label><label>Hits (optional)<input type="number" min="0" value="${r.hits??''}" onchange="updateScore('${p}',${i},'hits',this.value)"></label></div><label class="row" style="margin-top:10px"><input type="checkbox" ${r.complete?'checked':''} onchange="let s=getScore('${p}');let a=s.attempts[s.refire?1:0];a[${i}]??={};a[${i}].complete=this.checked;save();render()"> Instructor verified phase complete ${v.required?'(required in demo)':'(as applicable)'}</label></section>`}).join('')}<section class="panel"><div class="row spread"><div><strong>Course attempt</strong><div class="muted">${sm.total} recorded rounds • ${sm.complete?'All demo required phases complete':'Not yet complete'}</div></div><button ${s.refire?'disabled':''} onclick="if(confirm('Start the one permitted demo refire attempt?'))toggleRefire('${p}')">${s.refire?'Refire already used':'Start one refire'}</button></div><p class="muted">Refire creates a separate attempt. This demo does not certify qualification or enforce official refire eligibility.</p></section>`}
function personnel(){return `<section class="panel"><h2>Personnel directory</h2><div class="grid"><label>Name<input id="personname" placeholder="Full name"></label><label>Flight<select id="personflight">${['Alpha','Bravo','Charlie','Delta','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label></div><p><button onclick="addPerson()">Add person</button></p></section>${db.people.map(p=>`<section class="panel"><div class="row spread"><strong>${esc(p.name)}</strong><span class="pill">${esc(p.flight)}</span></div><label style="margin-top:10px">Unavailable dates (YYYY-MM-DD, comma-separated)<input value="${esc(p.unavailable)}" onchange="editUnavailable('${p.id}',this.value)" placeholder="2027-01-26, 2027-02-16"></label></section>`).join('')}`}
function printRoster(){let d=day(),c=cls();let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print the roster.');return}let rows=c.people.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(person(p)?.name)}</td><td>${esc(person(p)?.flight)}</td><td style="height:44px;width:45%;border-bottom:1px solid #888"></td></tr>`).join('');w.document.write(`<html><head><title>Attendance roster</title><style>body{font:13px Arial;margin:35px}h2{margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;border:1px solid #999;padding:8px}th{background:#eee}</style></head><body><h2>CATM Training Attendance Roster</h2><p><b>Date:</b> ${esc(d.date)} &nbsp; <b>Course:</b> ${esc(c.name)} &nbsp; <b>Weapon:</b> ${esc(c.weapon)}</p><table><thead><tr><th>#</th><th>Name</th><th>Flight</th><th>Signature</th></tr></thead><tbody>${rows}</tbody></table><p style="margin-top:24px">Instructor: _________________________ &nbsp; Date: __________</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function render(){['calendar','roster','scoring','personnel'].forEach(t=>$('tab-'+t).classList.toggle('active',db.tab===t));$('app').innerHTML=({calendar,roster,scoring,personnel}[db.tab]||calendar)()}
render();
</script></body></html>
